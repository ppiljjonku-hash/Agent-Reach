[project]
name = "agent-reach"
version = "1.6.0"
description = "Local tools for AI agents to search and read X, Reddit and YouTube with JSON output."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Neo Reid"}]
keywords = [
    "ai-agent", "llm-tools", "agent-infrastructure",
    "web-reader", "web-scraper", "search",
    "twitter-scraper", "reddit-scraper", "youtube-transcript",
    "ai-search", "cli", "automation",
    "claude-code", "cursor", "openai",
    "free-api", "no-api-key",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "yt-dlp[default]==2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[project.scripts]
agent-reach = "agent_reach.cli:main"

[project.urls]
Homepage = "https://github.com/ppiljjonku-hash/Agent-Reach"
Repository = "https://github.com/ppiljjonku-hash/Agent-Reach"
Issues = "https://github.com/ppiljjonku-hash/Agent-Reach/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_reach"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
